</head>

      div.innerHTML = `
        <span class="timestamp">${ev.iso_time.split("T")[1].replace("Z","")}</span>
        <span class="badge ${badgeClass}">${ev.event_type}</span>
        <span style="color: #cbd5e1;">${JSON.stringify(ev.details)}</span>

      term.scrollTop = term.scrollHeight;
