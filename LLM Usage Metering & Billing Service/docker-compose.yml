version: '3.8'

services:
  billing-service:
    build: .
    container_name: llm-usage-billing-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/billing.db
      - STRIPE_SECRET_KEY=sk_test_placeholder_key_for_local_eval
      - STRIPE_WEBHOOK_SECRET=whsec_test_secret_for_local_eval_signature_verification_123456
    volumes:
      - billing_data:/app/data
    restart: unless-stopped

volumes:
  billing_data:
